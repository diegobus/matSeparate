# HGNN baseline for Matador-C1 hierarchical classification
experiment_name: c1_hgnn_baseline

data:
  manifest_csv: data/processed/matador_c1/manifest.csv
  train_split: data/processed/matador_c1/splits/train.csv
  val_split: data/processed/matador_c1/splits/val.csv
  test_split: data/processed/matador_c1/splits/test.csv
  taxonomy_json: taxonomy/assets/matador-c1-taxonomy.json
  node_index: data/processed/matador_c1/node_index.json
  extracted_root: data/external/matador
  appearance_tar: null

model:
  cnn_backbone: resnet50
  cnn_pretrained: true
  cnn_output_dim: 1024
  cnn_checkpoint: null   # path to flat ResNet checkpoint to warm-start backbone
  gnn_input_dim: 1024
  gnn_hidden_dim: 512
  gnn_output_dim: 256
  gnn_layers: 2
  gnn_heads: 1
  dropout: 0.1
  complete_graph: false
  skip_connection: true

prototypes:
  init: cnn_average      # cnn_average | random | model_default
  path: data/processed/matador_c1/prototypes/hgnn_prototypes.pt
  allow_random_fallback: true
  sync_projection: true
  allow_projection_mismatch: false

graph:
  bidirectional_global_edges: true

training:
  image_size: 224
  batch_size: 16
  num_epochs: 5
  learning_rate: 1.0e-4
  weight_decay: 5.0e-4
  num_workers: 4
  device: auto
  seed: 1337
  loss: greedy_loss
  loss_mode: combined  # max | combined | parent_child_consistency

logging:
  runs_dir: runs
  log_interval: 10
