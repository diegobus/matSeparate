# HGNN prototype initialization for Matador-C1
experiment_name: hgnn_prototype_init

data:
  train_split: data/processed/matador_c1/splits/train.csv
  taxonomy_json: taxonomy/assets/matador-c1-taxonomy.json
  node_index: data/processed/matador_c1/node_index.json
  extracted_root: data/external/matador
  appearance_tar: null

encoder:
  backbone: resnet50
  pretrained: true
  checkpoint: null        # optional path to flat ResNet checkpoint
  feature_dim: 2048       # raw ResNet50 pooled feature dim
  image_size: 224
  batch_size: 64
  num_workers: 4
  device: auto
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]

prototypes:
  mode: cnn_average       # cnn_average or random
  output_dim: 1024        # final prototype dimension expected by HGNN gnn_input_dim
  random_seed: 1337
  random_std: 0.02
  normalize_features: false

output:
  out_dir: data/processed/matador_c1/prototypes
  filename: hgnn_prototypes.pt
